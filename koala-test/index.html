<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koala motion test</title>
<style>
:root{--bg:#15110c;--card:#221b13;--text:#f3ead9;--soft:#bfb3a0;--gold:#e0c68a}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px}
h1{font-size:22px;margin:0 0 6px} p{color:var(--soft);margin:0 0 14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;padding:12px}
.card h2{font-size:18px;margin:0 0 8px;color:var(--gold)} video{width:100%;border-radius:10px;display:block;background:#000}
button{background:var(--gold);color:#1a140c;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;margin:0 8px 14px 0}
</style></head><body><main>
<h1>Koala motion test — same line, two ways</h1>
<p>Watch his body, arms and head while he talks. Plain video, outside the game (nothing else on the page).</p>
<button id="all">▶ Play all three together</button><button id="sound">Sound on A</button>
<div class="row">
<div class="card"><h2>A — as it is in the game now</h2><video id="A" src="A.mp4" playsinline loop muted preload="auto"></video></div>
<div class="card"><h2>B — with the even-motion fix</h2><video id="B" src="B.mp4" playsinline loop muted preload="auto"></video></div>
<div class="card"><h2>C — his resting loop (reference)</h2><video id="C" src="C.mp4" playsinline loop muted preload="auto"></video></div>
</div></main>
<script>
const v=['A','B','C'].map(i=>document.getElementById(i));
document.getElementById('all').onclick=()=>{v.forEach(x=>{x.currentTime=0;x.play()})};
document.getElementById('sound').onclick=e=>{const a=v[0],b=v[1];if(a.muted){a.muted=false;b.muted=true;e.target.textContent='Sound on B'}else{a.muted=true;b.muted=false;e.target.textContent='Sound on A'}};
v.forEach(x=>x.addEventListener('click',()=>x.paused?x.play():x.pause()));
</script></body></html>
