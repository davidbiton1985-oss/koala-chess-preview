<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Koala Chess Players</title>
<!-- run-1013 C6: the OWNER DASHBOARD. Reads the anonymous counters (/api/stats, bearer token kept only in this
     browser). No ids exist anywhere: players are counted by each device's once-a-day "I was here, N days in". -->
<style>
:root {
  --bg: #F4EFE6; --surface: #FFFFFF; --ink: #1E1A15; --ink-2: #5A5146; --ink-3: #8A8072; --line: #E4DCCF;
  --bar: #B07A1F; --bar-2: #D9B56B; --good: #2E7D4F; --warn: #B4542D; --grid: #EEE7DB;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) {
  --bg: #12100D; --surface: #1C1915; --ink: #F3ECE0; --ink-2: #CFC4B3; --ink-3: #978C7C; --line: #2E2922;
  --bar: #E2B866; --bar-2: #8C6A2E; --good: #7FC79A; --warn: #E89A78; --grid: #26221C;
} }
:root[data-theme='dark'] {
  --bg: #12100D; --surface: #1C1915; --ink: #F3ECE0; --ink-2: #CFC4B3; --ink-3: #978C7C; --line: #2E2922;
  --bar: #E2B866; --bar-2: #8C6A2E; --good: #7FC79A; --warn: #E89A78; --grid: #26221C;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
h1 { margin: 0; font-size: 24px; } h2 { margin: 0 0 4px; font-size: 16px; } .sub { color: var(--ink-3); font-size: 13px; margin: 0 0 12px; }
.ranges { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 10px; border: 1px solid var(--line); }
.ranges button { border: 0; background: none; color: var(--ink-2); padding: 6px 12px; border-radius: 7px; font: inherit; cursor: pointer; min-height: 36px; }
.ranges button[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.tile .n { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--ink-2); font-size: 13px; } .tile .h { color: var(--ink-3); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.chart { position: relative; height: 180px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px); background-size: 100% 45px; background-position: 0 -1px; }
.chart .col { flex: 1; display: flex; align-items: flex-end; height: 100%; min-width: 0; }
.chart .col i { display: block; width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 1px; }
.chart .col:hover i { background: var(--ink); }
.axis { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 12px; margin-top: 4px; }
.peak { position: absolute; top: -2px; left: 0; color: var(--ink-3); font-size: 12px; }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; }
.row .bar { height: 14px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.row .bar i { display: block; height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
.row .v { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--line); } th { color: var(--ink-3); font-weight: 600; }
td.num, th.num { text-align: end; }
.gate { max-width: 420px; margin: 12vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
.gate input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; margin: 10px 0; }
.gate button, .btn { padding: 10px 16px; border: 0; border-radius: 10px; background: var(--ink); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; }
.note { color: var(--ink-3); font-size: 12px; margin-top: 18px; }
.err { color: var(--warn); }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); padding: 4px 8px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .1s; z-index: 9; }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip" role="tooltip"></div>
<script>
const API = 'https://queen-chess.queen-chess.workers.dev';
const KEY = 'koala.dashboard.token';
const STOPS = ['canyon-1','canyon-2','canyon-3','canyon-4','canyon-5','glacier-1','glacier-2','glacier-3','glacier-4','gardens-1','gardens-2','gardens-3','gardens-4','village-1','village-2','village-3','village-4','falls-1','falls-2','falls-3','falls-4','falls-5'];
const LEVELS = ['Very Easy','Easy','Medium','Challenging','Hard','Very Hard','Expert','Master'];
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (n) => n.toLocaleString('en-US');
const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : '—');
let token = ''; try { token = localStorage.getItem(KEY) || ''; } catch {}
let days = 30;
const app = document.getElementById('app');
const tip = document.getElementById('tip');
document.addEventListener('pointermove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  tip.style.left = `${Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12)}px`; tip.style.top = `${e.clientY - 34}px`;
});

function gate(msg) {
  app.replaceChildren($(`<div class="gate"><h1>Koala Chess players</h1><p class="sub">Paste your stats token (it stays in this browser only).</p>
    <form><label for="tk">Stats token</label><input id="tk" type="password" autocomplete="off" required><button>Open</button></form>
    ${msg ? `<p class="err">${esc(msg)}</p>` : ''}</div>`));
  app.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); token = app.querySelector('#tk').value.trim(); try { localStorage.setItem(KEY, token); } catch {} load(); });
}

async function load() {
  if (!token) return gate();
  app.replaceChildren($(`<p class="sub">Loading…</p>`));
  let r;
  try { r = await fetch(`${API}/api/stats?days=90`, { headers: { Authorization: `Bearer ${token}` } }); } catch { return gate('Could not reach the server.'); }
  if (r.status === 401) { try { localStorage.removeItem(KEY); } catch {} return gate('That token was not accepted.'); }
  if (!r.ok) return gate(`Server error ${r.status}.`);
  render(await r.json());
}

function render({ rows }) {
  // index: day → event → key → n
  const by = new Map();
  for (const { day, e, k, n } of rows) {
    if (!by.has(day)) by.set(day, {});
    const d = by.get(day); d[e] ??= {}; d[e][k] = (d[e][k] || 0) + n;
  }
  const dayList = []; const today = new Date();
  for (let i = days - 1; i >= 0; i--) dayList.push(new Date(today.getTime() - i * 86400000).toISOString().slice(0, 10));
  const sumE = (day, e, k) => { const x = by.get(day)?.[e]; if (!x) return 0; return k === undefined ? Object.values(x).reduce((a, b) => a + b, 0) : (x[k] || 0); };
  const inRange = (e, k) => dayList.reduce((a, d) => a + sumE(d, e, k), 0);
  const keysIn = (e) => { const m = {}; for (const d of dayList) for (const [k, n] of Object.entries(by.get(d)?.[e] || {})) m[k] = (m[k] || 0) + n; return m; };
  const t0 = dayList[dayList.length - 1];
  // this week (Monday on): active_week counts each device once per week
  const dow = (today.getUTCDay() + 6) % 7; let week = 0;
  for (let i = 0; i <= dow; i++) week += sumE(new Date(today.getTime() - i * 86400000).toISOString().slice(0, 10), 'active_week');
  // return rates: cohort = installs on day c; returned on day c+N = active · dN on that day (mature cohorts only)
  const ret = (N) => {
    let inst = 0, back = 0;
    for (const [day] of by) {
      const c = new Date(day + 'T00:00:00Z'); const back_day = new Date(c.getTime() + N * 86400000).toISOString().slice(0, 10);
      if (back_day > t0 || (Date.now() - c.getTime()) / 86400000 > 90) continue;
      inst += sumE(day, 'install'); back += sumE(back_day, 'active', `d${N}`);
    }
    return { inst, back };
  };
  const tile = (n, l, h) => `<div class="tile"><div class="n">${n}</div><div class="l">${esc(l)}</div>${h ? `<div class="h">${esc(h)}</div>` : ''}</div>`;
  const r1 = ret(1), r7 = ret(7), r30 = ret(30);
  const daily = dayList.map((d) => sumE(d, 'active'));
  const fresh = dayList.map((d) => sumE(d, 'install'));
  const avg = Math.round(daily.reduce((a, b) => a + b, 0) / Math.max(1, daily.length));

  const chart = (vals, label) => {
    const max = Math.max(1, ...vals);
    return `<div class="chart" role="img" aria-label="${esc(label)}"><span class="peak">${fmt(max)}</span>${vals.map((v, i) =>
      `<span class="col" data-tip="${dayList[i]}: ${fmt(v)}"><i style="height:${(v / max) * 100}%"></i></span>`).join('')}</div>
      <div class="axis"><span>${dayList[0]}</span><span>${t0}</span></div>`;
  };
  const bars = (entries, unit = '') => {
    const max = Math.max(1, ...entries.map(([, v]) => v));
    return `<div class="rows">${entries.map(([k, v, extra]) => `<div class="row" data-tip="${esc(k)}: ${fmt(v)}${unit}"><span>${esc(k)}</span><span class="bar"><i style="width:${(v / max) * 100}%"></i></span><span class="v">${fmt(v)}${extra ? ` · ${extra}` : ''}</span></div>`).join('')}</div>`;
  };
  const sorted = (m) => Object.entries(m).sort((a, b) => b[1] - a[1]);
  const starts = keysIn('stop_start'), dones = keysIn('stop_done');
  const funnel = STOPS.map((s) => [s, starts[s] || 0, pct(dones[s] || 0, starts[s] || 0) + ' finish']);
  const games = keysIn('game_end');
  const gameRows = LEVELS.map((name, i) => {
    const w = games[`${i + 1}:win`] || 0, l = games[`${i + 1}:loss`] || 0, d = games[`${i + 1}:draw`] || 0;
    return `<tr><td>${name}</td><td class="num">${fmt(w + l + d)}</td><td class="num">${fmt(w)}</td><td class="num">${fmt(l)}</td><td class="num">${fmt(d)}</td><td class="num">${pct(w, w + l + d)}</td></tr>`;
  }).join('');
  const SESS = ['lt1m', 'm1_3', 'm3_10', 'm10_30', 'm30_plus'], SESS_L = ['under 1 min', '1–3 min', '3–10 min', '10–30 min', '30+ min'];
  const sess = keysIn('session');

  app.replaceChildren($(`<div>
    <header><div><h1>Koala Chess players</h1><p class="sub">Anonymous counts · no ids, no personal data · updated live</p></div>
      <div class="ranges" role="group" aria-label="Range">${[7, 30, 90].map((n) => `<button data-d="${n}" aria-pressed="${n === days}">${n} days</button>`).join('')}</div></header>
    <section class="tiles">
      ${tile(fmt(sumE(t0, 'active')), 'Players today', `${fmt(sumE(t0, 'install'))} new`)}
      ${tile(fmt(week), 'Players this week', 'since Monday')}
      ${tile(fmt(avg), 'Players a day', `average, last ${days} days`)}
      ${tile(fmt(inRange('install')), 'New players', `last ${days} days`)}
      ${tile(pct(r1.back, r1.inst), 'Came back next day', `D1 · ${fmt(r1.back)} of ${fmt(r1.inst)}`)}
      ${tile(pct(r7.back, r7.inst), 'Came back on day 7', `D7 · ${fmt(r7.back)} of ${fmt(r7.inst)}`)}
      ${tile(pct(r30.back, r30.inst), 'Came back on day 30', `D30 · ${fmt(r30.back)} of ${fmt(r30.inst)}`)}
      ${tile(fmt(inRange('game_end')), 'Games vs Koala', `${fmt(inRange('puzzle_solved') + inRange('daily_solved'))} puzzles solved`)}
    </section>
    <div class="grid">
      <section class="card"><h2>Players per day</h2><p class="sub">Each device counts once a day</p>${chart(daily, 'Players per day')}</section>
      <section class="card"><h2>New players per day</h2><p class="sub">First time the game was opened on a device</p>${chart(fresh, 'New players per day')}</section>
      <section class="card"><h2>The Journey: who starts each stop</h2><p class="sub">Bar = times started · and the share that finished</p>${bars(funnel)}</section>
      <section class="card"><h2>Games against Koala, by level</h2><p class="sub">Is a level too hard? Watch the win rate</p>
        <table><thead><tr><th>Level</th><th class="num">Games</th><th class="num">Won</th><th class="num">Lost</th><th class="num">Draw</th><th class="num">Win rate</th></tr></thead><tbody>${gameRows}</tbody></table></section>
      <section class="card"><h2>How long a visit lasts</h2><p class="sub">One count per visit</p>${bars(SESS.map((k, i) => [SESS_L[i], sess[k] || 0]))}</section>
      <section class="card"><h2>Devices</h2><p class="sub">Once a day per device</p>${bars(sorted(keysIn('device')))}</section>
      <section class="card"><h2>Language</h2>${bars(sorted(keysIn('lang')).map(([k, v]) => [k === 'he' ? 'Hebrew' : 'English', v]))}</section>
      <section class="card"><h2>New features</h2><p class="sub">Race the Koala results, daily gifts opened, wardrobe purchases</p>${bars([['Races won', keysIn('race_end').win || 0], ['Races lost', keysIn('race_end').loss || 0], ['Gifts opened', inRange('gift_open')], ...sorted(keysIn('wardrobe_buy')).map(([k, v]) => ['Bought: ' + k, v])])}</section>
      <section class="card"><h2>Lessons finished</h2>${bars(sorted(keysIn('lesson_done')).slice(0, 12))}</section>
    </div>
    <p class="note">Counting is off for people whose browser asks not to be tracked, inside partner embeds and in test browsers, so the real numbers are a little higher. <button class="btn" id="out" style="margin-inline-start:8px">Forget token</button></p>
  </div>`));
  app.querySelectorAll('.ranges button').forEach((b) => b.addEventListener('click', () => { days = Number(b.dataset.d); render({ rows }); }));
  app.querySelector('#out').addEventListener('click', () => { try { localStorage.removeItem(KEY); } catch {} token = ''; gate(); });
}
load();
</script>
</body>
</html>
