<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <!-- M8a — the landscape "edge to edge" brief.
       viewport-fit=cover  the stage may paint into the notch/home-indicator areas; board3d.css pads the
                           chrome back out with env(safe-area-inset-*), so nothing readable lands under them.
       interactive-widget=resizes-content  Chrome/Android: a soft keyboard RESIZES the layout instead of
                           sliding it, which is what keeps visualViewport and the layout viewport agreeing.
       user-scalable / maximum-scale are deliberately NOT set: pinch-zoom is an accessibility right, and the
                           stage re-fits from visualViewport anyway (WCAG 1.4.4). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F4EADA">
  <meta name="description" content="Learn chess with Koala on a 3D island adventure, then play and solve puzzles.">
  <!-- the only way an iPhone ever loses Safari's address bar and tab strip is a standalone launch: the
       manifest makes "Add to Home Screen" open the game with no browser chrome at all.
       %EDITION_*% / manifest / brand/* come from the edition's meta.json (vite.config.ts editionIdentity). -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Koala Chess">
  <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Koala Chess">
  <meta property="og:description" content="Learn chess with Koala on a 3D island adventure, then play and solve puzzles.">
  <meta property="og:image" content="./brand/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="./brand/favicon.svg">
  <!-- the first paint's type: the body face and the rounded display face (self-hosted, chess/public/fonts — SIL OFL) -->
  <link rel="preload" href="./fonts/Assistant-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/Fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <!-- run-1017 P2-27: a Hebrew reader's first paint needs the Hebrew faces too (it flashed the fallback first) — preloaded
       only for one (the saved language, else ?lang=he, else the device's), so an English visitor downloads nothing more -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('queenchess:v1:settings') || 'null');
        var q = /[?&]lang=(he|en)\b/.exec(location.search);
        var he = s && s.locale ? s.locale === 'he' : q ? q[1] === 'he' : /^he\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '');
        if (he) ['Assistant-hebrew', 'Fredoka-hebrew'].forEach(function (f) {
          var l = document.createElement('link');
          l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = './fonts/' + f + '.woff2';
          document.head.appendChild(l);
        });
        // run-1101 r3: a returning player opens on Home: its chunks come with the entry, not a round trip after it (vite.config.ts firstScreen)
        if (s && s.firstRunDone && /^#?\/?$/.test(location.hash)) ["./assets/index-C_80E1tY.js","./assets/ux2-SJu-4BEa.js","./assets/plural-B6YVeRHS.js","./assets/feel-Ce8AbWHe.js","./assets/transit-DhWVixG9.js","./assets/burst-BWrS0tgl.js","./assets/home-CtJoqbid.js","./assets/index-BJUWTM6o.js","./assets/chess-Dz_znVVI.js","./assets/puzzles-B4Lo2bZM.js","./assets/journey-DaQ2qJF9.js","./assets/progressStore-B0OSvSXR.js","./assets/journeyNow-B97wdfkK.js","./assets/games-BqyKXZB7.js","./assets/learn2-Dr7WBpjT.js","./assets/components-B3j9FD2H.js","./assets/host-DU2Q82mP.js","./assets/mount-CNYf2vhb.js","./assets/set-CpX2PmK5.js","./assets/chirp-BhPtr_vx.js","./assets/hello-BonkcdQ-.js","./assets/mapLogic-D6nrhnkZ.js","./assets/map-DK1CNsQW.js","./assets/three.module-D5rf0S9N.js","./assets/stageGuard-DmwKnEKT.js","./assets/flag-CliDcTp8.js","./assets/chain-C_U1xDZ7.js","./assets/grade-BSuY6yDo.js","./assets/tier-L4U8tzMV.js"].forEach(function (href) {
          var l = document.createElement('link');
          l.rel = 'modulepreload'; l.href = href; l.crossOrigin = 'anonymous';
          document.head.appendChild(l);
        });
      } catch (e) { /* private mode: the fonts load with the CSS, as before */ }
    })();
  </script>
  <title>Koala Chess · שחמט קואלה</title>
  <!-- the boot card: painted with the HTML (before any script), gone when the first screen is in (ui/app.ts commit) -->
  <style>
    html, body { margin: 0; background: #0B0C0D; }
    .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: #e9dcc2;
      font: 600 17px/1.2 system-ui, -apple-system, sans-serif; letter-spacing: .02em; }
    .boot img { inline-size: 88px; block-size: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: boot 1.6s ease-in-out infinite; }
    .boot span { opacity: .8; }
    @keyframes boot { 50% { transform: scale(1.05); } }
    @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    /* the shell is built under the boot card, unseen, until the first screen is in (ui/app.ts) */
    .qc-app.is-booting { visibility: hidden; }
    /* run-1027 ?ux=2: the first paint is already the island's sky (the shell's clouds open on it, never on black) */
    html.ux2-boot, html.ux2-boot body { background: #F4EADA; }
    html.ux2-boot .boot { background: linear-gradient(to bottom, #FBE3B4, #F6DDB6 45%, #E8DAC2); color: #3B2A18; }
    html.ux2-boot .qc-app:not([data-kind]) { background: linear-gradient(to bottom, #FBE3B4, #F6DDB6 45%, #E8DAC2); }
    html.ux2-boot .boot img { box-shadow: 0 0 0 1px rgb(59 42 24 / .1), 0 5px 0 #E2CFAF, 0 16px 28px -12px rgb(59 42 24 / .4); }
  </style>
  <script>
    // the ux-2 shell (src/ux2/flag.ts): ?ux=2 asks for it, ?ux=1 for the old one, else the build's default (UX2_DEFAULT)
    (function () {
      var on = 'true' === 'true', s = location.search + location.hash;
      if (/[?&]ux=2\b/.test(s)) on = true; else if (/[?&]ux=1\b/.test(s)) on = false;
      if (on) document.documentElement.classList.add('ux2-boot');
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-CfAJHYxL.js"></script>
  <link rel="preload" as="style" crossorigin href="./assets/index-vOWjB7-Q.css" data-qc-css onload="this.onload=null;this.rel='stylesheet'">
</head>
<body>
  <div id="app"><div class="boot" aria-hidden="true"><img src="./brand/apple-touch-icon.png" alt=""><span>Koala Chess · שחמט קואלה</span></div></div>
</body>
</html>
